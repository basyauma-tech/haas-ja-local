[project]
name = "haas-ja-local"
version = "0.1.0"
description = "NeMo-free local inference and conversion (MLX / ONNX) for the Japanese ASR model Haas-ja-v1.0"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
    "soxr>=0.5",
]

[project.optional-dependencies]
mlx = ["mlx>=0.30; sys_platform == 'darwin'"]
onnx = ["onnxruntime>=1.20"]
convert = ["torch>=2.6", "safetensors>=0.5", "onnx>=1.17", "onnxruntime>=1.20"]
eval = [
    "jacer @ git+https://github.com/third-intelligence/jacer@v1.2.0",
    "huggingface_hub>=0.30",
    "pyarrow>=18",
]

[project.scripts]
haas-ja-local = "haas_ja_local.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: needs HAAS_JA_MODEL_DIR / HAAS_JA_NEMO"]
